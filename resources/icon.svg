<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Icône de Wakfu Professions Overlay : marteau d'artisan sur un disque clair cerclé de sombre.
       Source des icônes générées par scripts/make-icon.ts (npm run icon). -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b443d"/>
      <stop offset="1" stop-color="#1c1916"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbf1dc"/>
      <stop offset="0.7" stop-color="#ead5ae"/>
      <stop offset="1" stop-color="#d4b98a"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9561a"/>
      <stop offset="0.45" stop-color="#eea04e"/>
      <stop offset="1" stop-color="#b8601f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2e2e2"/>
      <stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e9e9"/>
      <stop offset="1" stop-color="#8d8d8d"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="124" fill="url(#ring)"/>
  <circle cx="128" cy="128" r="101" fill="url(#disc)"/>

  <!-- Marteau dessiné debout, puis incliné : tête en haut à gauche, manche vers le bas à droite. -->
  <g transform="rotate(-45 128 128) translate(128 130) scale(1.08) translate(-128 -130)">
    <!-- Ombre portée sur le disque -->
    <g transform="translate(5 7)" fill="#6b4a22" opacity="0.28">
      <rect x="115" y="100" width="26" height="112" rx="12"/>
      <rect x="70" y="54" width="116" height="54" rx="9"/>
    </g>
    <g stroke="#2e2419" stroke-width="6" stroke-linejoin="round">
      <!-- Manche -->
      <rect x="115" y="100" width="26" height="112" rx="12" fill="url(#wood)"/>
      <rect x="115" y="182" width="26" height="30" rx="12" fill="#8f4715"/>
      <!-- Tête : bloc et ses deux faces de frappe -->
      <rect x="80" y="58" width="96" height="46" rx="6" fill="url(#steel)"/>
      <rect x="68" y="52" width="22" height="58" rx="6" fill="url(#face)"/>
      <rect x="166" y="52" width="22" height="58" rx="6" fill="url(#face)"/>
    </g>
    <!-- Reflet sur le dessus de la tête -->
    <rect x="94" y="64" width="66" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
